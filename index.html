<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CEMENT // Quarantine Ward Phase 10</title><style>
:root{--bg:#07100e;--card:#0d1916;--line:#24483e;--ink:#dff9ed;--mut:#83a99c;--hot:#5fffc3;--warn:#ffd166;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17352d,#050908 55%);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:12px 12px 80px}.top{position:sticky;top:0;z-index:9;background:#07100eee;border:1px solid var(--line);border-radius:0 0 16px 16px;padding:12px;backdrop-filter:blur(10px)}.brand{font-weight:900;letter-spacing:2px;color:var(--hot)}.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:8px}.bar{height:5px;background:#10231d;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hot);width:0}.card{background:linear-gradient(180deg,#10201b,#09110f);border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:12px;box-shadow:0 12px 30px #0008}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--hot);font-weight:800}h1{font-size:25px;margin:7px 0 10px}p{line-height:1.5;color:#c6ded5}.choices{display:grid;gap:9px;margin-top:14px}.choice,button{width:100%;text-align:left;border:1px solid #315f52;border-radius:14px;background:#0a1512;color:var(--ink);padding:13px;font:inherit;font-weight:750}.choice small{display:block;color:var(--mut);font-weight:500;margin-top:4px}.choice.selected{border-color:var(--hot);box-shadow:inset 0 0 0 1px var(--hot)}button:active{transform:scale(.99)}.actions{display:flex;gap:8px;margin-top:14px}.primary{background:var(--hot);color:#04100c;text-align:center}.secondary{text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#07100e;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;font-size:11px;color:var(--mut)}.stat b{display:block;font-size:18px;color:var(--warn)}.patient{border-left:4px solid var(--warn)}.clue{padding:10px;border:1px dashed #3d7767;border-radius:12px;margin:7px 0;color:#cce8dd}.clue b{color:var(--hot)}.alert{color:var(--bad)}.good{color:var(--hot)}.tag{display:inline-block;padding:5px 8px;border:1px solid var(--line);border-radius:99px;margin:3px;color:var(--mut);font-size:12px}.sheet{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:430px){.stats{grid-template-columns:repeat(2,1fr)}.sheet{grid-template-columns:1fr}h1{font-size:22px}}.roomgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.room{border:1px solid var(--line);border-radius:12px;padding:10px;background:#07100e;text-align:center}.room b{display:block;color:var(--hot);font-size:16px}.timer{color:var(--warn);font-weight:900}.critical{border-color:var(--bad);box-shadow:0 0 18px #ff6b6b22}.chart{display:grid;gap:6px}.chartrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #17332b;padding:7px 0}.chartrow span:last-child{font-weight:800;color:#fff}.log{max-height:180px;overflow:auto;background:#050a08;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;color:var(--mut)}@media(max-width:430px){.roomgrid{grid-template-columns:1fr 1fr}} .queue{display:grid;gap:8px}.qpatient{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:11px;background:#07100e}.qpatient.active{border-color:var(--hot);box-shadow:0 0 15px #5fffc322}.qpatient.critical{border-color:var(--bad)}.qpatient button{width:auto;padding:9px 12px}.mini{font-size:11px;color:var(--mut)}
.command{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.command .room{min-height:70px}.dangerbar{height:8px;background:#220b0b;border-radius:8px;overflow:hidden;margin-top:7px}.dangerbar i{display:block;height:100%;background:var(--bad)}.win{border-color:var(--hot)}.lose{border-color:var(--bad)}@media(max-width:430px){.command{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header class="top"><div class="brand">CEMENT // QUARANTINE WARD // PHASE 10</div><div class="bar"><i id="prog"></i></div><div class="meta"><span id="label">ENTRY</span><span>▣ <b id="cement">0</b> CEMENT</span></div></header><main id="game"></main></div><script>
const $=q=>document.querySelector(q), KEY='cement.quarantine.v10';
const forms=[
['origin','ENTRY SHEET','Choose your medical background.',['Emergency Physician','Field Medic','Diagnostic Specialist']],
['instinct','TRIAGE SHEET','What do you trust first?',['Visual Signs','Patient History','Vital Patterns']],
['method','EXAM SHEET','Choose your default examination style.',['Careful & Complete','Fast Triage','Evidence First']],
['ethic','ETHICS SHEET','What guides difficult calls?',['Protect Patients','Protect the Ward','Preserve Evidence']],
['role','COMMAND SHEET','Choose your quarantine role.',['Ward Doctor','Containment Lead','Investigation Chief']]
];
const patients=[
{name:'Mara Venn',age:31,story:'A transit engineer found trembling beside a disabled tram.',truth:'infected',clues:{observe:'Sweating, hand tremor, and a faint branching rash near the wrist.',vitals:'Temperature 39.2°C; pulse elevated; oxygen stable.',history:'She reports sudden chills after helping an injured stranger in Sector 8.',scan:'Fictional QV-9 marker detected in the simulation scan.'}},
{name:'Jon Bell',age:54,story:'A warehouse worker brought in after collapsing during a double shift.',truth:'clear',clues:{observe:'Pale, exhausted, no characteristic rash.',vitals:'Temperature 37.1°C; pulse elevated; signs of dehydration.',history:'He skipped meals and worked sixteen hours. No known exposure.',scan:'No fictional QV-9 marker detected.'}},
{name:'Ilya Cross',age:22,story:'A student arrived coughing after leaving an evacuation shelter.',truth:'infected',clues:{observe:'Dry cough, glassy eyes, small branching discoloration behind one ear.',vitals:'Temperature 38.7°C; pulse elevated.',history:'Shared a shelter bay with two people later moved to isolation.',scan:'Fictional QV-9 marker detected in the simulation scan.'}},
{name:'Dr. Sato',age:43,story:'A clinic worker reports dizziness after three days on emergency duty.',truth:'clear',clues:{observe:'Fatigue and headache; skin clear.',vitals:'Temperature 36.9°C; blood pressure mildly low.',history:'Minimal sleep and poor fluid intake; protective protocol maintained.',scan:'No fictional QV-9 marker detected.'}},
{name:'Tomas Reed',age:67,story:'A traveler was stopped at the ward checkpoint after becoming confused.',truth:'infected',clues:{observe:'Confusion, flushed skin, branching marks beginning at the collar.',vitals:'Temperature 39.5°C; pulse elevated.',history:'Recently traveled through Sector 8 and cannot recall part of the trip.',scan:'Fictional QV-9 marker detected in the simulation scan.'}}
];
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){};S=S||{step:0,cement:0,answers:{},locked:false,day:1,patient:0,health:10,supplies:12,score:0,exam:[],decisions:[],time:0,beds:2,occupied:0,labQueue:0,treated:0,logs:[],food:6,power:8,morale:8,night:0,events:[],contamination:0,research:0,event:null,eventCount:0,activePatient:0,patientStates:{},completed:[]};
S.activePatient??=S.patient||0;S.patientStates??={};S.completed??=[];S.shiftLength??=30;S.arrivalWave??=0;S.survivors??=0;S.losses??=0;S.staff??={triage:'Nurse Vale',lab:'Tech Orin',isolation:'Medic Rho'};S.gameOver??=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} $('#cement').textContent=S.cement}
function shell(){save();$('#prog').style.width=(S.locked?Math.min(100,(S.completed.length/patients.length)*100):S.step/5*100)+'%'}
function render(){shell(); if(!S.locked)return S.step===0?intro():S.step<=5?sheet():cement(); ward()}
function intro(){$('#label').textContent='ENTRY';$('#game').innerHTML=`<section class="card"><div class="eyebrow">FICTIONAL SURVIVAL MEDICAL GAME</div><h1>The ward doors seal behind you.</h1><p>A fictional outbreak called <b>QV-9</b> is spreading through the station. Patients arrive with overlapping symptoms. Some carry the simulated virus. Others are simply sick, exhausted, or frightened.</p><p>Your job is to <b>examine clues before making a decision</b>. Wrong calls cost supplies and ward stability.</p><button class="primary" onclick="S.step=1;render()">BEGIN FIVE ENTRY SHEETS</button></section>`}
function sheet(){let f=forms[S.step-1],v=S.answers[f[0]];$('#label').textContent=`SHEET ${S.step}/5`;$('#game').innerHTML=`<section class="card"><div class="eyebrow">${f[1]}</div><h1>${f[2]}</h1><div class="choices">${f[3].map(x=>`<button class="choice ${v===x?'selected':''}" onclick="pick('${f[0]}','${x}')">${x}</button>`).join('')}</div><div class="actions">${S.step>1?'<button class="secondary" onclick="S.step--;render()">BACK</button>':''}<button class="primary" ${v?'':'disabled'} onclick="next()">SUBMIT SHEET</button></div></section>${record()}`}
function pick(k,v){S.answers[k]=v;save();render()} function next(){if(!S.answers[forms[S.step-1][0]])return;S.cement+=2;S.step++;render()}
function record(){return `<section class="card"><div class="eyebrow">DOCTOR RECORD</div>${forms.map(f=>`<span class="tag">${f[1]}: ${S.answers[f[0]]||'—'}</span>`).join('')}</section>`}
function cement(){ $('#label').textContent='CEMENT';$('#game').innerHTML=`<section class="card"><div class="eyebrow">CEMENT FORM</div><h1>Lock your doctor profile?</h1><p>Your five entry sheets become gameplay modifiers and remain visible throughout the ward.</p>${record()}<div class="actions"><button class="secondary" onclick="S.step=1;render()">EDIT</button><button class="primary" onclick="S.locked=true;S.cement+=5;save();render()">CEMENT & OPEN WARD</button></div></section>`}
function stats(){return `<section class="card"><div class="stats"><div class="stat"><b>${S.health}</b>WARD</div><div class="stat"><b>${S.supplies}</b>MEDICAL</div><div class="stat"><b>${S.food??6}</b>FOOD</div><div class="stat"><b>${S.power??8}</b>POWER</div><div class="stat"><b>${S.morale??8}</b>MORALE</div><div class="stat"><b>${S.cement}</b>CEMENT</div><div class="stat"><b>${S.contamination??0}%</b>CONTAM.</div><div class="stat"><b>${S.research??0}</b>RESEARCH</div></div></section>`}
function patientState(i=S.activePatient){let p=patients[i];if(!p)return null;if(!S.patientStates[i])S.patientStates[i]={condition:100-Math.min(20,i*3),room:i===S.activePatient?'TRIAGE':'WAITING',treated:false,isolated:false,minutes:0,exam:[]};return S.patientStates[i]}
function pRisk(i=S.activePatient){let p=patients[i];if(!p)return 0;return p.truth==='infected'?2.5:1}
function tick(n=1){S.time+=n;patients.forEach((p,i)=>{if(S.completed.includes(i))return;let ps=patientState(i);ps.minutes+=n;let protectedNow=ps.treated?0.45:1;ps.condition=Math.max(8,ps.condition-(pRisk(i)*n*protectedNow));if(ps.condition<=20&&!ps.warned){ps.warned=true;S.health=Math.max(0,S.health-1);S.logs.push(`T+${S.time}: ${p.name} became critical while waiting.`)}});if(S.time%3===0&&S.labQueue>0)S.labQueue--;if(S.time>0&&S.time%8===0){S.power=Math.max(0,(S.power??8)-1);S.food=Math.max(0,(S.food??6)-1)}if(S.time>0&&S.time%5===0)S.contamination=Math.min(100,(S.contamination??0)+4);if((S.contamination??0)>=70){S.health=Math.max(0,S.health-1);S.logs.push(`T+${S.time}: High contamination pressure damaged ward stability.`)}maybeEvent();save()}
function activeExam(){return patientState().exam}
function queuePanel(){let rows=patients.map((p,i)=>{if(S.completed.includes(i))return '';let ps=patientState(i),active=i===S.activePatient;return `<div class="qpatient ${active?'active':''} ${ps.condition<35?'critical':''}"><div><b>${p.name}</b><div class="mini">${ps.room} · condition ${Math.round(ps.condition)}% · waiting ${ps.minutes}m · clues ${ps.exam.length}/4</div></div><button onclick="switchPatient(${i})">${active?'ACTIVE':'OPEN CHART'}</button></div>`}).join('');return `<section class="card"><div class="eyebrow">LIVE PATIENT BOARD // ALL CASES RUNNING</div><h1>${patients.length-S.completed.length} active cases</h1><p>Time spent on one patient advances every unresolved patient. Switch charts whenever you need.</p><div class="queue">${rows}</div></section>`}
function switchPatient(i){if(S.completed.includes(i))return;S.activePatient=i;S.patient=i;let ps=patientState(i);if(ps.room==='WAITING')ps.room='TRIAGE';save();ward()}
function roomPanel(){let ps=patientState();return `<section class="card"><div class="eyebrow">WARD MAP // ELAPSED ${S.time} MIN</div><div class="roomgrid"><div class="room"><b>TRIAGE</b>Intake</div><div class="room"><b>EXAM 01</b>${ps.room==='EXAM 01'?'CURRENT':''}</div><div class="room"><b>EXAM 02</b>${ps.room==='EXAM 02'?'CURRENT':''}</div><div class="room"><b>LAB</b>Queue ${S.labQueue}</div><div class="room"><b>ISOLATION</b>${S.occupied}/${S.beds} beds</div><div class="room"><b>SUPPLY</b>${S.supplies} units</div></div></section>`}
function chart(p,ps){return `<section class="card ${ps.condition<45?'critical':''}"><div class="eyebrow">LIVE PATIENT CHART</div><div class="chart"><div class="chartrow"><span>Patient</span><span>${p.name} // ${p.age}</span></div><div class="chartrow"><span>Location</span><span>${ps.room}</span></div><div class="chartrow"><span>Condition</span><span>${Math.round(ps.condition)}%</span></div><div class="chartrow"><span>Time under evaluation</span><span>${ps.minutes} min</span></div><div class="chartrow"><span>Evidence collected</span><span>${ps.exam.length}/4</span></div></div></section>`}
function phase10Panel(){let phase=S.time<10?'DAY SHIFT':S.time<20?'DUSK SHIFT':'NIGHT SHIFT';let remain=Math.max(0,S.shiftLength-S.time);let unresolved=patients.length-S.completed.length;return `<section class="card"><div class="eyebrow">PHASE 10 // HOSPITAL COMMAND</div><h1>${phase} — T+${S.time} / ${S.shiftLength}</h1><div class="command"><div class="room"><b>${unresolved}</b><span class="mini">OPEN PATIENTS</span></div><div class="room"><b>${S.occupied}/${S.beds}</b><span class="mini">ISOLATION BEDS</span></div><div class="room"><b>${remain}</b><span class="mini">TIME REMAINING</span></div><div class="room"><b>${S.survivors}</b><span class="mini">STABILIZED</span></div><div class="room"><b>${S.losses}</b><span class="mini">LOST</span></div><div class="room"><b>${S.arrivalWave}</b><span class="mini">WAVES</span></div></div><p><b>Staff:</b> ${S.staff.triage} / ${S.staff.lab} / ${S.staff.isolation}</p><div class="actions"><button class="secondary" onclick="phase10Action('beds')">OPEN TEMP BED</button><button class="secondary" onclick="phase10Action('staff')">ROTATE STAFF</button></div></section>`}
function phase10Action(k){if(k==='beds'){if(S.supplies<2)return alert('Need 2 supplies.');S.supplies-=2;S.beds++;S.logs.push(`T+${S.time}: Temporary isolation bed opened.`)}else{if(S.food<1)return alert('Need 1 food.');S.food--;S.morale=Math.min(12,S.morale+2);S.logs.push(`T+${S.time}: Staff rotation completed.`)}tick(1);ward()}
function phase10Pulse(){if(S.time>0&&S.time%6===0&&S._lastWave!==S.time){S._lastWave=S.time;S.arrivalWave++;S.contamination=Math.min(100,S.contamination+5);S.logs.push(`T+${S.time}: Incoming patient wave ${S.arrivalWave} reached intake.`)}patients.forEach((p,i)=>{if(S.completed.includes(i))return;let ps=patientState(i);if(ps.condition<=8&&!ps.lost){ps.lost=true;S.losses++;S.health=Math.max(0,S.health-2);S.completed.push(i);S.logs.push(`T+${S.time}: ${p.name} was lost before disposition.`)}});if(S.health<=0||S.power<=0||S.morale<=0){S.gameOver=true}if(S.time>=S.shiftLength&&S.completed.length<patients.length){S.gameOver=true}}
function terminalEnding(){let won=S.health>0&&S.power>0&&S.morale>0&&S.completed.length>=patients.length;$('#label').textContent=won?'WARD SURVIVED':'WARD FAILED';$('#prog').style.width='100%';$('#game').innerHTML=`${stats()}<section class="card ${won?'win':'lose'}"><div class="eyebrow">PHASE 10 // FINAL SHIFT REPORT</div><h1>${won?'QUARANTINE WARD SURVIVED':'THE SHIFT COLLAPSED'}</h1><p>${won?'You resolved the patient board before the ward systems failed.':'Ward stability, power, morale, time, or unresolved casualties ended the shift.'}</p><div class="command"><div class="room"><b>${S.score}</b><span class="mini">CORRECT CALLS</span></div><div class="room"><b>${S.survivors}</b><span class="mini">STABILIZED</span></div><div class="room"><b>${S.losses}</b><span class="mini">LOST</span></div><div class="room"><b>${S.cement}</b><span class="mini">CEMENT</span></div></div><p>QV-9, its tests, symptoms, treatments, and ward procedures are fictional game mechanics.</p><button class="primary" onclick="localStorage.removeItem(KEY);location.reload()">START NEW SURVIVAL SHIFT</button></section>`}
function ward(){phase10Pulse();if(S.gameOver)return terminalEnding();if(S.completed.length>=patients.length)return ending();if(S.completed.includes(S.activePatient)){S.activePatient=patients.findIndex((p,i)=>!S.completed.includes(i));S.patient=S.activePatient}let p=patients[S.activePatient],ps=patientState();$('#label').textContent=`ACTIVE CASE ${S.activePatient+1}/${patients.length}`;let clues=ps.exam.map(k=>`<div class="clue"><b>${k.toUpperCase()}</b><br>${p.clues[k]}</div>`).join('');$('#game').innerHTML=`${stats()}${phase10Panel()}${queuePanel()}${roomPanel()}${eventPanel()}${researchPanel()}${survivalPanel()}${chart(p,ps)}<section class="card patient"><div class="eyebrow">QUARANTINE INTAKE // CASE ${String(S.patient+1).padStart(3,'0')}</div><h1>${p.name}, ${p.age}</h1><p>${p.story}</p><p><b>Every action advances ward time.</b> Condition can deteriorate while you investigate. Examination actions use supplies; the fictional QV-9 scan costs 2.</p>${clues||'<p class="alert">No clues collected yet.</p>'}<div class="choices">${examButton('observe','PHYSICAL EXAM','Look for visible signs.')} ${examButton('vitals','CHECK VITALS','Collect the fictional vital pattern.')} ${examButton('history','PATIENT HISTORY','Ask about exposure and recent events.')} ${examButton('scan','QV-9 LAB SCAN','Run the fictional outbreak marker test.',2)}</div><div class="actions"><button class="secondary" onclick="moveRoom('EXAM 01')">EXAM ROOM 1</button><button class="secondary" onclick="moveRoom('EXAM 02')">EXAM ROOM 2</button></div></section><section class="card"><div class="eyebrow">TREATMENT FORM</div><p>Support the patient while you investigate. These are fictional game actions, not medical instructions.</p><div class="sheet"><button class="choice" onclick="support('stabilize')">STABILIZE<small>Cost 2 supplies. +18 condition.</small></button><button class="choice" onclick="support('monitor')">CONTINUOUS MONITOR<small>Cost 1 supply. Slows immediate decline.</small></button></div></section><section class="card"><div class="eyebrow">DOCTOR DECISION FORM</div><h1>Disposition</h1><div class="sheet"><button class="choice" onclick="decide('infected')">ISOLATE — SUSPECT QV-9<small>Requires a free isolation bed.</small></button><button class="choice" onclick="decide('clear')">CLEAR OF QV-9<small>Release from outbreak isolation.</small></button></div></section>${record()}${S.logs.length?`<section class="card"><div class="eyebrow">SHIFT LOG</div><div class="log">${S.logs.slice(-8).reverse().map(x=>`<div>${x}</div>`).join('')}</div></section>`:''}`}

function eventPanel(){if(!S.event)return `<section class="card"><div class="eyebrow">WARD INCIDENT SYSTEM // PHASE 8</div><h1>No active incident.</h1><p>As ward time advances, emergencies can interrupt your patient investigation. They create Twine-style choices with resource consequences.</p></section>`;let e=S.event;return `<section class="card critical"><div class="eyebrow">⚠ ACTIVE WARD INCIDENT</div><h1>${e.title}</h1><p>${e.text}</p><div class="choices">${e.options.map((o,i)=>`<button class="choice" onclick="resolveEvent(${i})">${o.label}<small>${o.hint}</small></button>`).join('')}</div></section>`}
function maybeEvent(){if(S.event||S.time<2||S.eventCount>=4)return;let chance=(S.time%4===0)||Math.random()<.16;if(!chance)return;let pool=[
{title:'FILTER ALARM',text:'A fictional containment filter reports rising particulate load.',options:[{label:'SEAL & REPLACE FILTER',hint:'Costs 2 supplies. Strong contamination reduction.',fx:{supplies:-2,contamination:-18,morale:1}},{label:'REDUCE AIRFLOW',hint:'Saves supplies but costs power and morale.',fx:{power:-2,morale:-1,contamination:-6}}]},
{title:'PANICKED ARRIVAL',text:'Several frightened civilians crowd the intake doors while you are working the current case.',options:[{label:'ASSIGN STAFF TO TRIAGE',hint:'Costs morale, protects ward stability.',fx:{morale:-2,health:1}},{label:'LOCK INTAKE TEMPORARILY',hint:'Protects resources but raises contamination pressure outside.',fx:{contamination:8,morale:-1}}]},
{title:'LAB SAMPLE ANOMALY',text:'The fictional QV-9 analyzer flags an unusual pattern that could improve outbreak research.',options:[{label:'PRESERVE SAMPLE',hint:'Costs 1 supply, gains 3 research.',fx:{supplies:-1,research:3}},{label:'DISCARD & DECONTAMINATE',hint:'Reduces contamination.',fx:{contamination:-10}}]},
{title:'POWER FLICKER',text:'The isolation wing loses stable power for several seconds.',options:[{label:'DIVERT EMERGENCY POWER',hint:'Costs 2 power, protects stability.',fx:{power:-2,health:1}},{label:'MANUAL SYSTEM CHECK',hint:'Costs 1 time and morale; gains 1 Cement.',fx:{morale:-1,cement:1}}]}
];S.event=pool[S.eventCount%pool.length];S.eventCount++;S.logs.push(`T+${S.time}: INCIDENT — ${S.event.title}.`)}
function resolveEvent(i){let o=S.event&&S.event.options[i];if(!o)return;for(let [k,v] of Object.entries(o.fx)){S[k]=Math.max(0,(S[k]??0)+v)}S.contamination=Math.min(100,S.contamination??0);S.logs.push(`T+${S.time}: Incident response filed — ${o.label}.`);S.event=null;tick(1);ward()}
function researchPanel(){let unlock=(S.research??0)>=5;return `<section class="card"><div class="eyebrow">OUTBREAK RESEARCH FORM</div><h1>QV-9 Pattern Board</h1><p>Research points come from fictional lab events and careful case work. This is a game deduction system, not real medical guidance.</p><div class="chart"><div class="chartrow"><span>Research</span><span>${S.research??0} / 5</span></div><div class="chartrow"><span>Contamination pressure</span><span>${S.contamination??0}%</span></div><div class="chartrow"><span>Pattern status</span><span>${unlock?'SECONDARY PATTERN UNLOCKED':'INCOMPLETE'}</span></div></div>${unlock?'<p class="good">Research bonus active: each completed examination now earns +1 extra Cement.</p>':''}</section>`}
function survivalPanel(){return `<section class="card"><div class="eyebrow">SURVIVAL OPERATIONS // FORM 7</div><h1>Keep the ward alive.</h1><p>Medical decisions are only half the shift now. File one survival action when resources get tight.</p><div class="sheet"><button class="choice" onclick="survive('ration')">RATION FOOD<small>+2 food, -1 morale, advances time.</small></button><button class="choice" onclick="survive('generator')">SERVICE GENERATOR<small>Cost 1 supply, +3 power.</small></button><button class="choice" onclick="survive('rest')">ROTATE STAFF<small>Cost 1 food, +2 morale.</small></button><button class="choice" onclick="survive('salvage')">SEARCH STORAGE<small>Risk time for 1–3 supplies.</small></button></div></section>`}
function survive(kind){if(kind==='ration'){S.food=(S.food??6)+2;S.morale=Math.max(0,(S.morale??8)-1)}if(kind==='generator'){if(S.supplies<1)return alert('No spare medical/systems supply.');S.supplies--;S.power=Math.min(12,(S.power??8)+3)}if(kind==='rest'){if((S.food??6)<1)return alert('No food available for the staff rotation.');S.food--;S.morale=Math.min(12,(S.morale??8)+2)}if(kind==='salvage'){let gain=1+Math.floor(Math.random()*3);S.supplies+=gain;S.logs.push(`T+${S.time}: Storage search recovered ${gain} supplies.`)}tick(1);if((S.power??0)<=2){S.health=Math.max(0,S.health-1);S.logs.push(`T+${S.time}: Low power damaged ward stability.`)}if((S.morale??0)<=2){S.health=Math.max(0,S.health-1);S.logs.push(`T+${S.time}: Exhausted staff reduced ward stability.`)}S.logs.push(`T+${S.time}: Survival form filed — ${kind}.`);ward()}

function examButton(k,t,d,c=1){let done=patientState().exam.includes(k);return `<button class="choice ${done?'selected':''}" ${done?'disabled':''} onclick="examine('${k}',${c})">${done?'✓ ':''}${t}<small>${d} Cost: ${c} supply.</small></button>`}
function examine(k,c){if(S.supplies<c)return alert('Not enough supplies. Make a decision from the clues you have.');S.supplies-=c;patientState().exam.push(k);if(k==='scan')S.labQueue++;tick(k==='scan'?2:1);S.cement+=((S.research??0)>=5?2:1);S.contamination=Math.min(100,(S.contamination??0)+(k==='scan'?3:1));S.logs.push(`T+${S.time}: ${patients[S.activePatient].name} — ${k} completed.`);save();ward()}
function moveRoom(r){patientState().room=r;tick(1);S.logs.push(`T+${S.time}: Patient moved to ${r}.`);ward()}
function support(kind){let ps=patientState();let cost=kind==='stabilize'?2:1;if(S.supplies<cost)return alert('Not enough supplies.');S.supplies-=cost;if(kind==='stabilize'){ps.condition=Math.min(100,ps.condition+18);ps.treated=true;S.treated++}else{ps.condition=Math.min(100,ps.condition+7)}tick(1);S.logs.push(`T+${S.time}: Support form filed — ${kind}.`);ward()}
function decide(choice){let i=S.activePatient,p=patients[i],ps=patientState(i);if(ps.exam.length===0)return alert('Examine the patient for at least one clue first.');if(choice==='infected'&&S.occupied>=S.beds)return alert('Isolation is full. Resolve a current bed or make another disposition.');let correct=choice===p.truth;if(choice==='infected'){S.occupied++;ps.isolated=true;ps.room='ISOLATION'}S.decisions.push({name:p.name,choice,truth:p.truth,clues:[...ps.exam],condition:Math.round(ps.condition)});if(correct){S.score++;S.cement+=3;S.survivors++}else{S.health=Math.max(0,S.health-2);S.supplies=Math.max(0,S.supplies-1)}if(ps.condition<=25)S.health=Math.max(0,S.health-1);S.completed.push(i);let msg=correct?'Your evidence supported the disposition. +3 Cement.':'The disposition did not match the case evidence. Ward stability -2 and 1 supply lost.';$('#game').innerHTML=`${stats()}${phase10Panel()}${queuePanel()}<section class="card"><div class="eyebrow">CASE CLOSED</div><h1 class="${correct?'good':'alert'}">${correct?'Disposition supported':'Disposition challenged'}</h1><p>${msg}</p><p><b>Condition at disposition:</b> ${Math.round(ps.condition)}%. <b>Case truth:</b> ${p.truth==='infected'?'QV-9 simulated infection':'No QV-9 simulated infection'}.</p><button class="primary" onclick="nextPatient()">RETURN TO LIVE BOARD</button></section>`;save()}
function nextPatient(){let open=patients.map((p,i)=>i).find(i=>!S.completed.includes(i));if(open===undefined)return ending();S.activePatient=open;S.patient=open;tick(1);save();ward()}
function ending(){S.gameOver=true;return terminalEnding();/* legacy ending */ $('#label').textContent='SHIFT COMPLETE';$('#prog').style.width='100%';let good=S.score;$('#game').innerHTML=`${stats()}<section class="card"><div class="eyebrow">SURVIVAL SHIFT COMPLETE</div><h1>${good} / ${patients.length} dispositions supported by the case evidence.</h1><p>You survived the quarantine shift with <b>${S.health}</b> ward stability and <b>${S.supplies}</b> supplies remaining.</p><p>The outbreak, symptoms, tests, and medical decisions in this game are fictional and are designed as deduction mechanics rather than real diagnostic guidance.</p><div class="actions"><button class="secondary" onclick="S.patient=0;S.activePatient=0;S.patientStates={};S.completed=[];S.exam=[];S.score=0;S.health=10;S.supplies=12;S.decisions=[];S.time=0;S.occupied=0;S.labQueue=0;S.treated=0;S.logs=[];S.food=6;S.power=8;S.morale=8;S.contamination=0;S.research=0;S.event=null;S.eventCount=0;patients.forEach(p=>delete p.state);save();ward()">REPLAY WARD</button><button class="primary" onclick="if(confirm('Erase everything?')){localStorage.removeItem(KEY);location.reload()}">NEW GAME</button></div></section>${record()}`}
render();
</script></body></html>
